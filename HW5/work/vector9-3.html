<!DOCTYPE html>
<html>
<head>
    <title>US Population Growth 1820-1920</title>
    <meta charset="utf-8" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }
        #map {
            width: 100%;

        }
        
        /* Combined Controls Container - Bottom Center */
        .controls-container {
            position: absolute;
            bottom: 10px;

            right: 10px;
            z-index: 1000;
            background: rgba(20, 20, 30, 0.85);

            color: #fff;

            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .controls-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .controls-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .classification-section {
            display: flex;
            flex-direction: column;

        }
        
        .classification-section h4 {
            margin: 0 0 5px 0;

        }
        
        .classification-buttons {

        }
        
        .classification-btn {
            background: #002130;

        .classification-btn.active {

        }
        
        .ai-toggle-container {

        .growth-toggle {

        #enable-ai {
            background: #002130;

        #time-slider {

        #time-slider::-webkit-slider-thumb {

            border: 2px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.7);

        #time-slider::-moz-range-thumb {

        /* Legend - Top Right */
        .legend-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(20, 20, 30, 0.85);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);

        .legend-container h4 {

        .legend-item {
            display: flex;

        /* Loading screen */
        #loading-container {

            width: 100%;

            z-index: 2000;

            flex-direction: column;
            justify-content: center;

        #loading-bar {

            border: 1px solid #00f0ff;

        #loading-progress {

        #loading-text {

        /* AI Explanation Styles */
        .ai-explanation {
            margin-top: 8px;

            overflow-y: auto;

        .ai-loading {

            font-style: italic;
        }
        
        .ai-error {

        /* Hide Leaflet attribution */
        .leaflet-control-attribution {
            display: none !important;

        /* Mobile responsiveness */
        @media (max-width: 768px) {

            .controls-top-row, .controls-bottom-row {

            .classification-section, .ai-toggle-container {

            .layer-toggle-container {

            .layer-toggle-btn {

            .slider-section {
                min-width: 100%;
            }
            
            .legend-container {
                top: 5px;
                right: 5px;

            }
            
            #year-display {

        @media (max-width: 480px) {
            .legend-container {
                max-width: 150px;
                font-size: 11px;

            .legend-color {
                width: 12px;
                height: 12px;
            }
            
            .layer-toggle-btn {
                padding: 6px 8px;
                font-size: 12px;
            }
            
            .classification-btn {
                min-width: 60px;
                font-size: 11px;
                padding: 5px 8px;
            }
        }
    </style>

<body>
    <div id="loading-container">
        <h2>Loading Map Data</h2>
        <div id="loading-bar">
            <div id="loading-progress"></div>
        </div>
        <div id="loading-text">Initializing...</div>
    </div>
    
    <div id="map"></div>
    
    <!-- Legend - Top Right -->
    <div class="legend-container" id="legend-container">
        <!-- Dynamic legend content will be inserted here -->
    </div>
    
    <!-- Combined Controls Container - Bottom Center -->
    <div class="controls-container">
        
        <div class="controls-bottom-row">
            <div class="slider-section">
                <div id="year-display">1820</div>
                <input type="range" min="0" max="9" value="0" id="time-slider">
                <div class="decade-markers">
                    <span>1820</span>
                    <span>1830</span>
                    <span>1840</span>
                    <span>1850</span>
                    <span>1860</span>
                    <span>1870</span>
                    <span>1890</span>
                    <span>1900</span>
                    <span>1910</span>
                    <span>1920</span>
                </div>
                <div class="decade-info">
                    <div class="info-item" id="info-population">Population: Loading...</div>
                    <div class="info-item" id="info-rivers">Canals: 0</div>
                    <div class="info-item" id="info-railroads">Railroads: 0</div>
                </div>
            </div>
        </div>
        <div class="controls-top-row">
            <div class="classification-section">
                <h4>Data Classification</h4>
                <div class="classification-buttons">
                    <button class="classification-btn active" data-method="quantile">Quantile</button>
                    <button class="classification-btn" data-method="linear">Linear</button>
                    <button class="classification-btn" data-method="logarithmic">Log</button>
                </div>
            </div>
            
            <div class="ai-toggle-container">
                <div class="growth-toggle">
                    <input type="checkbox" id="show-growth">
                    <label for="show-growth">Show Growth Rates</label>
                </div>
                <button id="enable-ai">Enable AI Explanations</button>
                <div id="ai-status">AI: Disabled</div>
            </div>
            
            <div class="layer-toggle-container">
                <button class="layer-toggle-btn" id="toggle-train">Railroads</button>
                <button class="layer-toggle-btn" id="toggle-river">Canals</button>
                <button class="layer-toggle-btn" id="toggle-trail">Trails</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <!-- Leaflet.VectorGrid plugin -->
    <script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>
    
    <!-- Your GeoJSON files -->
    <script src="1820.js"></script>
    <script src="1830.js"></script>
    <script src="1840.js"></script>
    <script src="1850.js"></script>
    <script src="1860.js"></script>
    <script src="1870.js"></script>
    <script src="1890.js"></script>
    <script src="1900.js"></script>
    <script src="1910.js"></script>
    <script src="1920.js"></script>
    <script src="trail.js"></script>
    <script src="river.js"></script>
    <script src="train2.js"></script>
    <script src="state.js"></script>
    
    <script>
        // Initialize the map
        const map = L.map('map', {
            attributionControl: false // Disable default attribution
        }).setView([39.8283, -98.5795], 4);
        
        // Add Carto Dark as default base layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '', // Empty attribution to prevent display
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        // Current classification method
        let currentClassification = 'quantile';
        
        // AI Configuration
        let API_KEY = localStorage.getItem('OPENROUTER_API_KEY');
        let aiEnabled = false;

        function validateAPIKey() {
            if (!API_KEY) {
                API_KEY = prompt("🔑 Enter your OpenRouter API key (get one at https://openrouter.ai/keys):");
                if (API_KEY) {
                    localStorage.setItem('OPENROUTER_API_KEY', API_KEY);
                    checkAPIStatus();
                } else {
                    document.getElementById('ai-status').textContent = 'AI: Disabled (no key)';
                    document.getElementById('ai-status').style.color = '#ff3300';
                    document.getElementById('enable-ai').disabled = true;
                }
            } else {
                checkAPIStatus();
            }
        }

        const API_ENDPOINT = 'https://openrouter.ai/api/v1/chat/completions';
        validateAPIKey();
        
        let showGrowthRates = false;
        
        // Default vectorization settings
        const vectorSettings = {
            tileSize: 256,
            maxZoom: 14,
            bufferSize: 128
        };
        
        // Object to store our layers
        const layers = {};
        
        // List of all your GeoJSON variable names
        const layerNames = [
            'state', 'train2', 'river', 'trail',
            'y1820', 'y1830', 'y1840', 'y1850', 
            'y1860', 'y1870', 'y1890', 'y1900',
            'y1910', 'y1920'
        ];
        
        // Layer colors
        const layerColors = {
            'state': '#00BBFF',
            'river': '#1A00B6',
            'trail': '#FF9900',
            'train2': '#FF00CC',
            'y1820': '#FF3300',
            'y1830': '#FF6600',
            'y1840': '#FFCC00',
            'y1850': '#99FF00',
            'y1860': '#00FF66',
            'y1870': '#00FFCC',
            'y1890': '#0099FF',
            'y1900': '#6600FF',
            'y1910': '#CC00FF',
            'y1920': '#FF00FF'
        };
        
        // Loading progress tracking
        const loadingProgress = {
            total: layerNames.length,
            loaded: 0,
            updateProgress: function() {
                const percent = Math.round((this.loaded / this.total) * 100);
                document.getElementById('loading-progress').style.width = percent + '%';
                document.getElementById('loading-text').textContent = 
                    `Loading layers (${this.loaded}/${this.total})...`;
                
                if (this.loaded === this.total) {
                    setTimeout(() => {
                        document.getElementById('loading-container').style.display = 'none';
                        // Add default layers in correct z-index order
                        if (layers.state) layers.state.addTo(map);
                        
                        // Add layers in specific order: population < railroads < canals < trails
                        const yearLayer = `y1820`;
                        if (layers[yearLayer]) layers[yearLayer].addTo(map);
                        
                        if (layers.train2) {
                            layers.train2.addTo(map);
                            document.getElementById('toggle-train').classList.add('active');
                        }
                        
                        if (layers.river) {
                            layers.river.addTo(map);
                            document.getElementById('toggle-river').classList.add('active');
                        }
                        
                        if (layers.trail) {
                            layers.trail.addTo(map);
                            document.getElementById('toggle-trail').classList.add('active');
                        }
                        
                        // Initialize time slider
                        updateMapForDecade(0);
                    }, 500);
                }
            }
        };
        
        // Function to create a graduated color scale for population data
        function getGraduatedColor(value, min, max, values, classification = currentClassification) {
            // If showing growth rates
            if (showGrowthRates) {
                if (value === null) return 'rgba(50, 50, 50, 0.3)';
                return value > 0 ?
                       (value > 10 ? '#0c0' : '#8d0') : // Greens for growth
                       (value < -10 ? '#c00' : '#f60'); // Reds for decline
            }
            
            // Original population count coloring
            if (value === null || value === undefined || value === 0) {
                return 'rgba(50, 50, 50, 0.3)';
            }
            
            // Filter out null/undefined/zero values and sort
            const sortedValues = [...values].filter(v => v > 0).sort((a, b) => a - b);
            
            // Define our color scale (5 classes)
            const colors = [
                'rgba(0, 255, 157, 0.8)',    // Vivid electric green
                'rgba(20, 220, 110, 0.8)',    // Bright jade
                'rgba(0, 180, 90, 0.8)',      // Medium cyber green
                'rgba(0, 140, 70, 0.8)',      // Darker tech green
                'rgba(0, 100, 50, 0.8)'       // Deep emerald
            ];
            
            if (classification === 'linear') {
                // Linear classification
                const ratio = (value - min) / (max - min);
                if (ratio <= 0.2) return colors[0];
                if (ratio <= 0.4) return colors[1];
                if (ratio <= 0.6) return colors[2];
                if (ratio <= 0.8) return colors[3];
                return colors[4];
            }
            else if (classification === 'logarithmic') {
                // Logarithmic classification
                const logMin = Math.log10(min || 1);
                const logMax = Math.log10(max);
                const logValue = Math.log10(value);
                const ratio = (logValue - logMin) / (logMax - logMin);
                
                if (ratio <= 0.2) return colors[0];
                if (ratio <= 0.4) return colors[1];
                if (ratio <= 0.6) return colors[2];
                if (ratio <= 0.8) return colors[3];
                return colors[4];
            }
            else if (classification === 'quantile') {
                // Quantile classification
                const breaks = [
                    sortedValues[Math.floor(sortedValues.length * 0.2)],
                    sortedValues[Math.floor(sortedValues.length * 0.4)],
                    sortedValues[Math.floor(sortedValues.length * 0.6)],
                    sortedValues[Math.floor(sortedValues.length * 0.8)]
                ];
                
                if (value <= breaks[0]) return colors[0];
                if (value <= breaks[1]) return colors[1];
                if (value <= breaks[2]) return colors[2];
                if (value <= breaks[3]) return colors[3];
                return colors[4];
            }
            
            // Default to quantile if no valid classification
            const breaks = [
                sortedValues[Math.floor(sortedValues.length * 0.2)],
                sortedValues[Math.floor(sortedValues.length * 0.4)],
                sortedValues[Math.floor(sortedValues.length * 0.6)],
                sortedValues[Math.floor(sortedValues.length * 0.8)]
            ];
            
            if (value <= breaks[0]) return colors[0];
            if (value <= breaks[1]) return colors[1];
            if (value <= breaks[2]) return colors[2];
            if (value <= breaks[3]) return colors[3];
            return colors[4];
        }
        
        // Function to create a vector tile layer with graduated colors
        function createGraduatedVectorLayer(name, geoJsonData, populationField) {
            // Extract year from populationField (e.g., "A00AA1920" -> "1920")
            const year = populationField.slice(5);
            const prevYear = String(parseInt(year) - 10);
            const prevPopulationField = `A00AA${prevYear}`;
            
            // Calculate growth rates for each feature
            geoJsonData.features.forEach(feature => {
                const currPop = feature.properties[populationField] || 0;
                const prevPop = feature.properties[prevPopulationField] || 0;
                let growthRate = null;
                
                if (prevPop > 0) {
                    growthRate = ((currPop - prevPop) / prevPop) * 100;
                }
                
                feature.properties.growthRate = growthRate;
                feature.properties.prevPopulation = prevPop;
                feature.properties.prevYear = prevYear;
            });

            // Extract population values for scaling
            const populationValues = geoJsonData.features
                .map(f => f.properties[populationField])
                .filter(val => val !== null && val !== undefined);
            
            const minValue = Math.min(...populationValues.filter(v => v > 0));
            const maxValue = Math.max(...populationValues);
            
            // Create the vector grid layer with graduated colors
            const layer = L.vectorGrid.slicer(geoJsonData, {
                rendererFactory: L.svg.tile,
                vectorTileLayerStyles: {
                    sliced: function(properties) {
                        const value = showGrowthRates ? properties.growthRate : properties[populationField];
                        return {
                            weight: 1.5,
                            color: '#00f0ff',
                            opacity: 0.8,
                            fillColor: getGraduatedColor(value, minValue, maxValue, populationValues),
                            fillOpacity: 0.85,
                            fill: true
                        };
                    }
                },
                maxZoom: vectorSettings.maxZoom,
                tileSize: vectorSettings.tileSize,
                buffer: vectorSettings.bufferSize,
                interactive: true,
                getFeatureId: function(f) {
                    return f.properties.id || L.stamp(f);
                }
            });
            
            // Store metadata in layer for legend
            layer.metadata = {
                field: showGrowthRates ? 'growthRate' : populationField,
                min: minValue,
                max: maxValue,
                name: name,
                values: populationValues,
                classification: currentClassification
            };
            
            // Add popup with detailed information
            layer.on('click', function(e) {
                const props = e.layer.properties;
                const population = props[populationField];
                const prevPopulation = props.prevPopulation || 0;
                const growthRate = props.growthRate || 0;
                const prevYear = props.prevYear || 'unknown';
                const changeWord = growthRate > 0 ? "increase" : "decrease";
                
                let popupContent = `<div style="color:#000;">
                    <b>${props.NHGISNAM || props.COUNTY_1 || 'Area'}</b><br>
                    <b>State:</b> ${props.STATENAM || props.STATE_1 || ''}<br>
                    <b>Year:</b> ${year}<br>
                    <b>Population:</b> ${population ? population.toLocaleString() : 'No data'}<br>
                    <b>Change from ${prevYear}:</b> ${growthRate !== null ? growthRate.toFixed(2) + '% ' + changeWord : 'No data'}<br>
                    <div id="explanation-${L.stamp(e.layer)}" class="ai-explanation ai-loading">
                        ${aiEnabled ? 'Loading AI analysis...' : 'Enable AI for explanations'}
                    </div>
                </div>`;
                
                const popup = L.popup()
                    .setContent(popupContent)
                    .setLatLng(e.latlng)
                    .openOn(map);
                
                // Load AI explanation if enabled
                if (aiEnabled && props.growthRate !== null && Math.abs(props.growthRate) >= 4) {
                    getDeepSeekExplanation(
                        props.NHGISNAM || props.COUNTY_1 || 'This area',
                        props.STATENAM || props.STATE_1 || '',
                        prevYear,
                        year,
                        props.prevPopulation,
                        population,
                        props.growthRate
                    ).then(explanation => {
                        const explanationDiv = document.getElementById(`explanation-${L.stamp(e.layer)}`);
                        if (explanationDiv) {
                            explanationDiv.innerHTML = `<b>AI Analysis:</b><br>${explanation}`;
                            explanationDiv.classList.remove('ai-loading');
                        }
                    }).catch(error => {
                        const explanationDiv = document.getElementById(`explanation-${L.stamp(e.layer)}`);
                        if (explanationDiv) {
                            explanationDiv.innerHTML = `<b>Error:</b> Could not load analysis`;
                            explanationDiv.classList.remove('ai-loading');
                            explanationDiv.classList.add('ai-error');
                        }
                    });
                }
            });
            
            // Store feature count in layer metadata
            if (geoJsonData && geoJsonData.features) {
                layer.featureCount = geoJsonData.features.length;
            } else {
                layer.featureCount = 0;
            }
            
            return layer;
        }
        
        // Function to create a vector tile layer
        function createVectorTileLayer(name, geoJsonData) {
            const layerColor = layerColors[name] || getRandomColor();
            
            const layer = L.vectorGrid.slicer(geoJsonData, {
                rendererFactory: L.svg.tile,
                vectorTileLayerStyles: {
                    sliced: {
                        color: layerColor,
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0.5,
                        fillColor: layerColor
                    }
                },
                maxZoom: vectorSettings.maxZoom,
                tileSize: vectorSettings.tileSize,
                buffer: vectorSettings.bufferSize,
                interactive: true,
                getFeatureId: function(f) {
                    return f.properties.id || L.stamp(f);
                }
            });
            
            // Store feature count in layer metadata
            if (geoJsonData && geoJsonData.features) {
                layer.featureCount = geoJsonData.features.length;
            } else {
                layer.featureCount = 0;
            }
            
            return layer;
        }
        
        // Function to update the legend
        function updateLegend() {
            const legendContainer = document.getElementById('legend-container');
            
            // Get the active population layer to display its legend
            const activeLayers = Object.keys(layers).filter(name => {
                return map.hasLayer(layers[name]) && 
                      name.startsWith('y') && 
                      layers[name].metadata;
            });
            
            if (activeLayers.length === 0) {
                legendContainer.innerHTML = '<h4>No Data Active</h4>';
                return;
            }
            
            // Use the first active population layer
            const activeLayer = layers[activeLayers[0]];
            const metadata = activeLayer.metadata;
            
            if (showGrowthRates) {
                // Growth rate legend
                legendContainer.innerHTML = `
                    <h4>Population Growth (${metadata.name.slice(1)})</h4>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #c00;"></div>
                        <div class="legend-label">Decline > 10%</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #f60;"></div>
                        <div class="legend-label">Decline 0-10%</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #8d0;"></div>
                        <div class="legend-label">Growth 0-10%</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #0c0;"></div>
                        <div class="legend-label">Growth > 10%</div>
                    </div>
                    <div class="legend-item" style="margin-top: 5px;">
                        <div class="legend-color" style="background-color: rgba(50, 50, 50, 0.3);"></div>
                        <div class="legend-label">No data</div>
                    </div>
                `;
            } else {
                // Population count legend
                const values = metadata.values.filter(v => v > 0).sort((a, b) => a - b);
                
                // Calculate breaks based on current classification
                let breaks = [];
                if (currentClassification === 'linear') {
                    const range = metadata.max - metadata.min;
                    breaks = [
                        metadata.min + range * 0.2,
                        metadata.min + range * 0.4,
                        metadata.min + range * 0.6,
                        metadata.min + range * 0.8
                    ];
                } else if (currentClassification === 'logarithmic') {
                    const logMin = Math.log10(metadata.min || 1);
                    const logMax = Math.log10(metadata.max);
                    const logRange = logMax - logMin;
                    breaks = [
                        Math.pow(10, logMin + logRange * 0.2),
                        Math.pow(10, logMin + logRange * 0.4),
                        Math.pow(10, logMin + logRange * 0.6),
                        Math.pow(10, logMin + logRange * 0.8)
                    ];
                } else if (currentClassification === 'quantile') {
                    breaks = [
                        values[Math.floor(values.length * 0.2)],
                        values[Math.floor(values.length * 0.4)],
                        values[Math.floor(values.length * 0.6)],
                        values[Math.floor(values.length * 0.8)]
                    ];
                }
                
                // Define our color scale (5 classes)
                const colors = [
                    'rgba(0, 255, 157, 0.8)',    // Vivid electric green
                    'rgba(20, 220, 110, 0.8)',    // Bright jade
                    'rgba(0, 180, 90, 0.8)',      // Medium cyber green
                    'rgba(0, 140, 70, 0.8)',      // Darker tech green
                    'rgba(0, 100, 50, 0.8)'       // Deep emerald
                ];
                
                // Create legend content
                let legendContent = `
                    <h4>Population ${metadata.name.slice(1)}</h4>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: ${colors[0]};"></div>
                        <div class="legend-label">&lt; ${Math.round(breaks[0]).toLocaleString()}</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: ${colors[1]};"></div>
                        <div class="legend-label">${Math.round(breaks[0]).toLocaleString()} - ${Math.round(breaks[1]).toLocaleString()}</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: ${colors[2]};"></div>
                        <div class="legend-label">${Math.round(breaks[1]).toLocaleString()} - ${Math.round(breaks[2]).toLocaleString()}</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: ${colors[3]};"></div>
                        <div class="legend-label">${Math.round(breaks[2]).toLocaleString()} - ${Math.round(breaks[3]).toLocaleString()}</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: ${colors[4]};"></div>
                        <div class="legend-label">&gt; ${Math.round(breaks[3]).toLocaleString()}</div>
                    </div>
                    <div class="legend-item" style="margin-top: 5px;">
                        <div class="legend-color" style="background-color: rgba(50, 50, 50, 0.3);"></div>
                        <div class="legend-label">No data</div>
                    </div>
                `;
                
                legendContainer.innerHTML = legendContent;
            }
        }
        
        // Function to show only one year at a time
        function showYearLayer(year) {
            // Remove all year layers first
            Object.keys(layers).forEach(name => {
                if (name.startsWith('y')) {
                    map.removeLayer(layers[name]);
                }
            });
            
            // Add the selected year layer
            const layerName = `y${year}`;
            if (layers[layerName]) {
                layers[layerName].addTo(map);
                
                // Ensure proper z-index ordering
                if (layers.train2 && map.hasLayer(layers.train2)) {
                    layers.train2.bringToFront();
                }
                if (layers.river && map.hasLayer(layers.river)) {
                    layers.river.bringToFront();
                }
                if (layers.trail && map.hasLayer(layers.trail)) {
                    layers.trail.bringToFront();
                }
                
                updateLegend();
                return true;
            } else {
                return false;
            }
        }
        
        // AI Explanation Functions
        async function getDeepSeekExplanation(countyName, stateName, prevYear, currYear, prevPop, currPop, growthRate) {
            if (!aiEnabled) return "Enable AI for explanations";
            
            // Early return for small changes
            if (Math.abs(growthRate) < 4) {
                return "Change too small for detailed analysis (less than 4%).";
            }

            const prompt = `As a historical demographer, explain why ${countyName}, ${stateName} had a ${growthRate.toFixed(2)}% population ${growthRate > 0 ? "increase" : "decrease"} between ${prevYear} and ${currYear}. Focus on 1-2 likely factors like migration patterns, economic conditions, or historical events. Keep response to 3 sentences max.`;

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Population Growth Map"
                    },
                    body: JSON.stringify({
                        "model": "deepseek/deepseek-chat",
                        "messages": [
                            {
                                "role": "system",
                                "content": "You provide concise historical explanations for population changes. Focus on facts from the specified time period."
                            },
                            {
                                "role": "user", 
                                "content": prompt
                            }
                        ],
                        "max_tokens": 150,
                        "temperature": 0.7
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                
                // Extract response from known structure
                return data.choices[0].message.content;

            } catch (err) {
                console.error("API Error:", err);
                return `Error: ${err.message}`;
            }
        }
        
        async function checkAPIStatus() {
            try {
                const response = await fetch('https://openrouter.ai/api/v1/auth/key', {
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`
                    }
                });
                
                if (response.ok) {
                    document.getElementById('ai-status').textContent = 'AI: Connected';
                    document.getElementById('ai-status').style.color = '#00f0ff';
                } else {
                    aiEnabled = false;
                    document.getElementById('enable-ai').textContent = 'Enable AI Explanations';
                    document.getElementById('ai-status').textContent = 'AI: Error (check key)';
                    document.getElementById('ai-status').style.color = '#ff3300';
                    const errorData = await response.json();
                    console.error('API Error Details:', errorData);
                }
            } catch (error) {
                aiEnabled = false;
                document.getElementById('enable-ai').textContent = 'Enable AI Explanations';
                document.getElementById('ai-status').textContent = 'AI: Connection failed';
                document.getElementById('ai-status').style.color = '#ff3300';
                console.error('API connection test failed:', error);
            }
        }

        // Function to filter rivers based on the decade
        function filterRiversForDecade(decade) {
            const yearMap = {
                0: 1820, 1: 1830, 2: 1840, 3: 1850, 4: 1860,
                5: 1870, 6: 1890, 7: 1900, 8: 1910, 9: 1920
            };
            const year = yearMap[decade];
            
            if (window.river && layers.river) {
                if (map.hasLayer(layers.river)) {
                    map.removeLayer(layers.river);
                }
                
                const filteredRivers = {
                    type: "FeatureCollection",
                    features: []
                };
                
                // Include rivers with null values or those matching the year filter
                river.features.forEach(feature => {
                    const opened = feature.properties.OPENED;
                    const closed = feature.properties.CLOSED || 9999;
                    
                    if (opened === null || closed === null ||
                        (opened && closed && opened <= year && closed >= year)) {
                        filteredRivers.features.push(feature);
                    }
                });

                // Create new filtered layer
                const filteredRiverLayer = L.vectorGrid.slicer(filteredRivers, {
                    rendererFactory: L.svg.tile,
                    vectorTileLayerStyles: {
                        sliced: {
                            color: layerColors.river || '#00F0FF',
                            weight: 2,
                            opacity: 0.8,
                            fillOpacity: 0.5,
                            fillColor: layerColors.river || '#00F0FF'
                        }
                    },
                    maxZoom: vectorSettings.maxZoom,
                    tileSize: vectorSettings.tileSize,
                    buffer: vectorSettings.bufferSize,
                    interactive: true,
                    getFeatureId: function(f) {
                        return f.properties.id || L.stamp(f);
                    }
                });

                // Add popup functionality
                filteredRiverLayer.on('click', function(e) {
                    const props = e.layer.properties;
                    let popupContent = `<div style="color:#000;"><b>${props.NAME || 'Canal'}</b><br>`;
                    popupContent += `Opened: ${props.OPENED || 'Unknown'}<br>`;
                    popupContent += `Closed: ${props.CLOSED || 'Still active'}<br>`;
                    if (props.LENGHT) popupContent += `Length: ${props.LENGHT} miles<br>`;
                    if (props.REFERENCE) popupContent += `Reference: ${props.REFERENCE}<br>`;
                    popupContent += '</div>';
                    
                    L.popup()
                        .setContent(popupContent)
                        .setLatLng(e.latlng)
                        .openOn(map);
                });

                // Store feature count
                filteredRiverLayer.featureCount = filteredRivers.features.length;

                // Replace the original river layer in our layers object
                layers.river = filteredRiverLayer;

                // Add the filtered layer if checkbox is checked
                const riverBtn = document.getElementById('toggle-river');
                if (riverBtn && riverBtn.classList.contains('active')) {
                    layers.river.addTo(map);
                    layers.river.bringToFront(); // Ensure canals appear above railroads
                }

                // Update info display
                document.getElementById('info-rivers').textContent = 
                    `Canals: ${filteredRivers.features.length}`;
            }
        }
        
        // Function to filter trains based on the decade
        function filterTrainsForDecade(decade) {
            const yearMap = {
                0: 1820, 1: 1830, 2: 1840, 3: 1850, 4: 1860,
                5: 1870, 6: 1890, 7: 1900, 8: 1910, 9: 1920
            };
            const year = yearMap[decade];
            
            // If train layer exists and is loaded
            if (window.train2 && layers.train2) {
                // Remove existing train layer
                if (map.hasLayer(layers.train2)) {
                    map.removeLayer(layers.train2);
                }
                
                // Clone the original GeoJSON
                const filteredTrains = {
                    type: "FeatureCollection",
                    features: []
                };
                
                // Filter features that were built by the selected year
                train2.features.forEach(feature => {
                    const trainDecade = feature.properties.Decade;
                    
                    if (trainDecade && trainDecade <= year) {
                        filteredTrains.features.push(feature);
                    }
                });
                
                // Create new filtered layer
                const filteredTrainLayer = L.vectorGrid.slicer(filteredTrains, {
                    rendererFactory: L.svg.tile,
                    vectorTileLayerStyles: {
                        sliced: {
                            color: layerColors.train2 || '#FF00CC',
                            weight: 2,
                            opacity: 0.8,
                            fillOpacity: 0.5,
                            fillColor: layerColors.train2 || '#FF00CC'
                        }
                    },
                    maxZoom: vectorSettings.maxZoom,
                    tileSize: vectorSettings.tileSize,
                    buffer: vectorSettings.bufferSize,
                    interactive: true,
                    getFeatureId: function(f) {
                        return f.properties.id || L.stamp(f);
                    }
                });
                
                // Add popup functionality
                filteredTrainLayer.on('click', function(e) {
                    const props = e.layer.properties;
                    let popupContent = `<div style="color:#000;"><b>Railroad</b><br>`;
                    popupContent += `Built: ${props.Decade}<br>`;
                    popupContent += `State: ${props.STATENAM || 'N/A'}<br>`;
                    if (props.SUM_Miles) popupContent += `Length: ${props.SUM_Miles.toFixed(2)} miles<br>`;
                    popupContent += '</div>';
                    
                    L.popup()
                        .setContent(popupContent)
                        .setLatLng(e.latlng)
                        .openOn(map);
                });
                
                // Store feature count
                filteredTrainLayer.featureCount = filteredTrains.features.length;
                
                // Replace the original train layer in our layers object
                layers.train2 = filteredTrainLayer;
                
                // Add the filtered layer if checkbox is checked
                const trainBtn = document.getElementById('toggle-train');
                if (trainBtn && trainBtn.classList.contains('active')) {
                    layers.train2.addTo(map);
                    // Ensure railroads appear above population but below canals and trails
                    layers.train2.bringToFront();
                    if (layers.river && map.hasLayer(layers.river)) layers.river.bringToFront();
                    if (layers.trail && map.hasLayer(layers.trail)) layers.trail.bringToFront();
                }
                
                // Update info display
                document.getElementById('info-railroads').textContent = 
                    `Railroads: ${filteredTrains.features.length}`;
            }
        }
        
        // Get total population for a specific year layer
        function getTotalPopulation(yearLayer) {
            if (!window[yearLayer] || !window[yearLayer].features) {
                return "Unknown";
            }
            
            const yearMatch = yearLayer.match(/\d{4}/);
            if (!yearMatch) return "Unknown";
            
            const year = yearMatch[0];
            const populationField = `A00AA${year}`;
            
            // Sum all population values
            let totalPop = 0;
            window[yearLayer].features.forEach(feature => {
                if (feature.properties && feature.properties[populationField]) {
                    totalPop += feature.properties[populationField];
                }
            });
            
            // Format with commas
            return totalPop.toLocaleString();
        }
        
        // Function to update all layers for the selected decade
        function updateMapForDecade(decadeIndex) {
            const yearMap = {
                0: '1820', 1: '1830', 2: '1840', 3: '1850', 4: '1860',
                5: '1870', 6: '1890', 7: '1900', 8: '1910', 9: '1920'
            };
            const year = yearMap[decadeIndex];
            
            // Update the year display
            document.getElementById('year-display').textContent = year;
            
            // Show the population layer for this decade
            showYearLayer(year);
            
            // Filter rivers based on their OPENED/CLOSED properties
            filterRiversForDecade(decadeIndex);
            
            // Filter trains based on their Decade property
            filterTrainsForDecade(decadeIndex);
            
            // Ensure trails are on top
            if (layers.trail && map.hasLayer(layers.trail)) {
                layers.trail.bringToFront();
            }
            
            // Update the population info
            const yearLayer = `y${year}`;
            const totalPop = getTotalPopulation(yearLayer);
            document.getElementById('info-population').textContent = `Population: ${totalPop}`;
        }
        
        // Function to initialize all layers
        function initializeLayers() {
            // Clear existing layers
            layerNames.forEach(name => {
                if (layers[name]) {
                    map.removeLayer(layers[name]);
                    layers[name] = null;
                }
            });
            
            // Reset progress
            loadingProgress.loaded = 0;
            loadingProgress.updateProgress();
            document.getElementById('loading-container').style.display = 'flex';
            
            // Create layers with current settings
            layerNames.forEach(name => {
                // Update loading text to show current layer being processed
                document.getElementById('loading-text').textContent = `Processing ${name}...`;
                
                // Process in small chunks to keep UI responsive
                setTimeout(() => {
                    // Check if the variable exists in global scope
                    if (window[name]) {
                        try {
                            // Handle population data layers differently
                            if (name.startsWith('y')) {
                                const year = name.substring(1); // e.g., '1820'
                                const populationField = `A00AA${year}`;
                                
                                layers[name] = createGraduatedVectorLayer(name, window[name], populationField);
                            } else {
                                // For non-population layers (like state, river, etc.), use the original method
                                const layerColor = layerColors[name] || getRandomColor();
                                layers[name] = createVectorTileLayer(name, window[name]);
                                
                                // Add popup functionality
                                layers[name].on('click', function(e) {
                                    const props = e.layer.properties;
                                    let popupContent = `<div style="color:#000;"><b>${name}</b><br>`;
                                    
                                    for (const key in props) {
                                        popupContent += `${key}: ${props[key]}<br>`;
                                    }
                                    popupContent += '</div>';
                                    
                                    L.popup()
                                        .setContent(popupContent)
                                        .setLatLng(e.latlng)
                                        .openOn(map);
                                });
                            }
                            
                        } catch (e) {
                            console.error(`Error processing layer ${name}:`, e);
                        }
                    } else {
                        console.warn(`Variable ${name} not found in global scope`);
                    }
                    
                    // Update progress
                    loadingProgress.loaded++;
                    loadingProgress.updateProgress();
                    
                }, 0); // Small timeout to allow UI updates between layers
            });
        }
        
        // Listen for layer changes to update the legend
        map.on('layeradd layerremove', function(e) {
            updateLegend();
        });
        
        // Initialize layers on load
        initializeLayers();
        
        // Layer toggle buttons
        document.getElementById('toggle-train').addEventListener('click', function() {
            this.classList.toggle('active');
            if (this.classList.contains('active')) {
                layers.train2.addTo(map);
                // Ensure proper z-index ordering
                layers.train2.bringToFront();
                if (layers.river && map.hasLayer(layers.river)) layers.river.bringToFront();
                if (layers.trail && map.hasLayer(layers.trail)) layers.trail.bringToFront();
            } else {
                map.removeLayer(layers.train2);
            }
        });
        
        document.getElementById('toggle-river').addEventListener('click', function() {
            this.classList.toggle('active');
            if (this.classList.contains('active')) {
                layers.river.addTo(map);
                // Ensure proper z-index ordering
                layers.river.bringToFront();
                if (layers.trail && map.hasLayer(layers.trail)) layers.trail.bringToFront();
            } else {
                map.removeLayer(layers.river);
            }
        });
        
        document.getElementById('toggle-trail').addEventListener('click', function() {
            this.classList.toggle('active');
            if (this.classList.contains('active')) {
                layers.trail.addTo(map);
                // Ensure trails are always on top
                layers.trail.bringToFront();
            } else {
                map.removeLayer(layers.trail);
            }
        });
        
        // AI toggle button
        document.getElementById('enable-ai').addEventListener('click', function() {
            aiEnabled = !aiEnabled;
            this.textContent = aiEnabled ? 'Disable AI Explanations' : 'Enable AI Explanations';
            document.getElementById('ai-status').textContent = `AI: ${aiEnabled ? 'Enabled' : 'Disabled'}`;
            document.getElementById('ai-status').style.color = aiEnabled ? '#00f0ff' : '#ff3300';
            
            if (aiEnabled) {
                // Check API connection
                document.getElementById('ai-status').textContent = 'AI: Checking connection...';
                checkAPIStatus();
            }
        });
        
        // Growth rate toggle
        document.getElementById('show-growth').addEventListener('change', function() {
            showGrowthRates = this.checked;
            
            // Recreate all year layers with new visualization
            Object.keys(layers).forEach(name => {
                if (name.startsWith('y') && layers[name].metadata) {
                    const year = name.substring(1);
                    const populationField = `A00AA${year}`;
                    
                    // Recreate the layer
                    const newLayer = createGraduatedVectorLayer(name, window[name], populationField);
                    
                    // Replace the existing layer
                    if (map.hasLayer(layers[name])) {
                        map.removeLayer(layers[name]);
                        newLayer.addTo(map);
                        
                        // Ensure proper z-index ordering
                        if (layers.train2 && map.hasLayer(layers.train2)) layers.train2.bringToFront();
                        if (layers.river && map.hasLayer(layers.river)) layers.river.bringToFront();
                        if (layers.trail && map.hasLayer(layers.trail)) layers.trail.bringToFront();
                    }
                    layers[name] = newLayer;
                }
            });
            
            // Update the legend
            updateLegend();
        });
        
        // Classification button handlers
        document.querySelectorAll('.classification-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Update active state
                document.querySelectorAll('.classification-btn').forEach(b => {
                    b.classList.remove('active');
                });
                this.classList.add('active');
                
                // Set new classification method
                currentClassification = this.dataset.method;
                
                // Update all population layers
                Object.keys(layers).forEach(name => {
                    if (name.startsWith('y') && layers[name].metadata) {
                        layers[name].metadata.classification = currentClassification;
                        if (map.hasLayer(layers[name])) {
                            map.removeLayer(layers[name]);
                            layers[name].addTo(map);
                            
                            // Ensure proper z-index ordering
                            if (layers.train2 && map.hasLayer(layers.train2)) layers.train2.bringToFront();
                            if (layers.river && map.hasLayer(layers.river)) layers.river.bringToFront();
                            if (layers.trail && map.hasLayer(layers.trail)) layers.trail.bringToFront();
                        }
                    }
                });
                
                // Update the legend
                updateLegend();
            });
        });
        
        // Time slider event listener
        document.getElementById('time-slider').addEventListener('input', function() {
            updateMapForDecade(this.value);
        });
    </script>
