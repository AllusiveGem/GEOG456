<!DOCTYPE html>
<html>
<head>
    <title>Population Change Map (DeepSeek AI Enabled)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .explanation {
            margin-top: 8px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .legend {
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #999;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        .legend h4 {
            margin: 0 0 8px 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .legend-color {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 8px;
        }
        .info-button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 8px 12px;
            background: white;
            border: 1px solid #999;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        .api-status {
            position: absolute;
            top: 50px;
            right: 10px;
            z-index: 1000;
            padding: 8px 12px;
            background: white;
            border: 1px solid #999;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button class="info-button" onclick="showInfo()">ℹ️ About</button>
    <div class="api-status" id="apiStatus">API: Checking...</div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([35.5, -80.5], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // API Configuration
        const API_KEY = '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';
        const API_ENDPOINT = 'https://openrouter.ai/api/v1/chat/completions';
        let apiStatus = 'unknown';

        // Test API connection on load
        checkAPIStatus();

        async function checkAPIStatus() {
            const statusElement = document.getElementById('apiStatus');
            try {
                const response = await fetch('https://openrouter.ai/api/v1/auth/key', {
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`
                    }
                });
                
                if (response.ok) {
                    apiStatus = 'connected';
                    statusElement.textContent = 'API: Connected';
                    statusElement.style.color = 'green';
                } else {
                    apiStatus = 'error';
                    statusElement.textContent = 'API: Error (check key)';
                    statusElement.style.color = 'red';
                    const errorData = await response.json();
                    console.error('API Error Details:', errorData);
                }
            } catch (error) {
                apiStatus = 'error';
                statusElement.textContent = 'API: Connection failed';
                statusElement.style.color = 'red';
                console.error('API connection test failed:', error);
            }
        }

        function showInfo() {
            alert('Population Change Map (1910-1920)\n\nClick counties for AI-generated explanations (via DeepSeek Chat)');
        }

        const geojsonData = {
            "type": "FeatureCollection",
            "features": [
                {
                    "type": "Feature",
                    "properties": {
                        "NHGISNAM": "Mock County A",
                        "STATENAM": "NC",
                        "A00AA1920": 10500,
                        "A00AA1910": 10000
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[
                            [-80.7, 35.4], [-80.3, 35.4], [-80.3, 35.6], [-80.7, 35.6], [-80.7, 35.4]
                        ]]
                    }
                },
                {
                    "type": "Feature",
                    "properties": {
                        "NHGISNAM": "Mock County B",
                        "STATENAM": "NC",
                        "A00AA1920": 9000,
                        "A00AA1910": 10000
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[
                            [-80.2, 35.4], [-79.8, 35.4], [-79.8, 35.6], [-80.2, 35.6], [-80.2, 35.4]
                        ]]
                    }
                }
            ]
        };

        function getColor(growthRate) {
            if (growthRate === null) return '#888';
            return growthRate > 0 ?
                   (growthRate > 10 ? '#0c0' : '#8d0') :
                   (growthRate < -10 ? '#c00' : '#f60');
        }

        async function getDeepSeekExplanation(countyName, year, prevYear, growthRate) {
            if (apiStatus !== 'connected') {
                return "API connection issue. Please check your API key and connection.";
            }

            if (Math.abs(growthRate) < 4) {
                return "Change too small for detailed analysis (less than 4%).";
            }

            const prompt = `You're a historical demographer. Why might ${countyName} have had a ${growthRate.toFixed(2)}% population ${growthRate > 0 ? "increase" : "decrease"} between ${prevYear} and ${year} in North Carolina? Focus on migration, economy, and historical events. Keep your answer brief (2-3 sentences).`;

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Population Change Map"
                    },
                    body: JSON.stringify({
                        "model": "deepseek/deepseek-chat:free",
                        "messages": [
                            { "role": "user", "content": prompt }
                        ],
                        "max_tokens": 150,
                        "temperature": 0.7,
                        "transforms": ["middle-out"] // Added to comply with data policy
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error("API Error:", response.status, errorData);
                    
                    // Special handling for data policy errors
                    if (errorData.error?.message?.includes("data policy")) {
                        return "Please enable prompt training in your OpenRouter settings: https://openrouter.ai/settings/privacy";
                    }
                    
                    return `API Error: ${errorData.error?.message || response.statusText}`;
                }

                const data = await response.json();
                return data?.choices?.[0]?.message?.content || "No explanation available.";

            } catch (err) {
                console.error("DeepSeek API error:", err);
                return `Network Error: ${err.message || "Couldn't retrieve explanation."}`;
            }
        }

        function createBasicPopupContent(props, year, prevYear, currPop, prevPop, growthRate) {
            const changeWord = growthRate > 0 ? "increase" : "decrease";
            return `<b>${props.NHGISNAM}</b><br>
                <b>State:</b> ${props.STATENAM}<br>
                <b>Year:</b> ${year}<br>
                <b>Population:</b> ${currPop.toLocaleString()}<br>
                <b>Change from ${prevYear}:</b> ${growthRate.toFixed(2)}% ${changeWord}<br>
                <div id="explanation-${props.NHGISNAM.replace(/\s+/g, '')}" class="explanation loading">
                    ${apiStatus === 'connected' ? 'Loading DeepSeek AI analysis...' : 'API connection issue - analysis unavailable'}
                </div>`;
        }

        function processFeatures() {
            const layers = {};
            geojsonData.features.forEach(feature => {
                const props = feature.properties;
                const year = '1920';
                const prevYear = '1910';
                const currPop = props[`A00AA${year}`] || 0;
                const prevPop = props[`A00AA${prevYear}`] || 0;

                let growthRate = null;
                if (prevPop > 0) {
                    growthRate = ((currPop - prevPop) / prevPop) * 100;
                }

                const layer = L.geoJSON(feature, {
                    style: {
                        color: "#000",
                        weight: 1,
                        fillColor: getColor(growthRate),
                        fillOpacity: 0.7
                    }
                }).addTo(map);

                const countyId = props.NHGISNAM.replace(/\s+/g, '');
                layers[countyId] = { layer, props, growthRate };

                const popupContent = createBasicPopupContent(
                    props, year, prevYear, currPop, prevPop, growthRate
                );

                layer.bindPopup(popupContent);

                layer.on('mouseover', function () {
                    this.setStyle({ weight: 2, fillOpacity: 0.9 });
                });

                layer.on('mouseout', function () {
                    this.setStyle({ weight: 1, fillOpacity: 0.7 });
                });

                layer.on('popupopen', async function () {
                    const explanationDiv = document.getElementById(`explanation-${countyId}`);
                    if (explanationDiv && explanationDiv.classList.contains('loading') && apiStatus === 'connected') {
                        try {
                            const explanation = await getDeepSeekExplanation(
                                props.NHGISNAM, year, prevYear, growthRate
                            );
                            explanationDiv.innerHTML = `<b>DeepSeek AI Analysis:</b><br>${explanation}`;
                            explanationDiv.classList.remove('loading');
                        } catch (error) {
                            explanationDiv.innerHTML = 'Error connecting to DeepSeek AI service.';
                            explanationDiv.classList.remove('loading');
                        }
                    }
                });
            });
            return layers;
        }

        processFeatures();

        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>Population Change (1910–1920)</h4>
                <div class="legend-item"><span class="legend-color" style="background:#c00"></span> Significant Decline (>10%)</div>
                <div class="legend-item"><span class="legend-color" style="background:#f60"></span> Moderate Decline (0–10%)</div>
                <div class="legend-item"><span class="legend-color" style="background:#8d0"></span> Moderate Growth (0–10%)</div>
                <div class="legend-item"><span class="legend-color" style="background:#0c0"></span> Significant Growth (>10%)</div>
            `;
            return div;
        };
        legend.addTo(map);

        const attribution = L.control.attribution({ position: 'bottomleft' }).addTo(map);
        attribution.addAttribution('AI by <a href="https://openrouter.ai/" target="_blank">DeepSeek via OpenRouter</a>');
    </script>
</body>
</html>
