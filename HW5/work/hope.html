<!DOCTYPE html>
<html>
<head>
    <title>Population Change Map with AI</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .info-button {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            padding: 8px 12px;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .api-status {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 8px 12px;
            background: white;
            border-radius: 4px;
        }
        .explanation {
            margin-top: 8px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
        }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div id="map"></div>
    <button class="info-button" onclick="showInfo()">ℹ️ About</button>
    <div class="api-status" id="apiStatus">API: Checking...</div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([39.8283, -98.5795], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // API Configuration
        const API_KEY = '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';
        const API_ENDPOINT = 'https://openrouter.ai/api/v1/chat/completions';
        let apiStatus = 'unknown';

        // Test API connection
        checkAPIStatus();

        async function checkAPIStatus() {
            const statusElement = document.getElementById('apiStatus');
            try {
                const response = await fetch('https://openrouter.ai/api/v1/auth/key', {
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`
                    }
                });
                
                if (response.ok) {
                    apiStatus = 'connected';
                    statusElement.textContent = 'API: Connected';
                    statusElement.style.color = 'green';
                } else {
                    apiStatus = 'error';
                    statusElement.textContent = 'API: Error (check key)';
                    statusElement.style.color = 'red';
                }
            } catch (error) {
                apiStatus = 'error';
                statusElement.textContent = 'API: Connection failed';
                statusElement.style.color = 'red';
            }
        }

        function showInfo() {
            alert('Population Change Map\n\nClick counties for AI-generated explanations of population changes between decades');
        }

        // Sample data for two counties (replace with your actual data)
        const geojsonData = {
            "type": "FeatureCollection",
            "features": [
                {
                    "type": "Feature",
                    "properties": {
                        "NHGISNAM": "Sample County A",
                        "STATENAM": "Kentucky",
                        "A00AA1820": 5000,
                        "A00AA1830": 6500,
                        "A00AA1840": 7000
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[
                            [-85.26,38.57],[-85.25,38.57],[-85.25,38.58],[-85.26,38.58],[-85.26,38.57]
                        ]]
                    }
                },
                {
                    "type": "Feature",
                    "properties": {
                        "NHGISNAM": "Sample County B",
                        "STATENAM": "Kentucky",
                        "A00AA1820": 8000,
                        "A00AA1830": 7500,
                        "A00AA1840": 6000
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[
                            [-85.30,38.57],[-85.29,38.57],[-85.29,38.58],[-85.30,38.58],[-85.30,38.57]
                        ]]
                    }
                }
            ]
        };

        // Function to calculate population change
        function calculateChange(currPop, prevPop) {
            if (prevPop > 0) {
                return ((currPop - prevPop) / prevPop) * 100;
            }
            return null;
        }

        // Color scale for population change
        function getChangeColor(change) {
            if (change === null) return '#888';
            return change > 0 ? 
                   (change > 20 ? '#0c0' : '#8d0') :
                   (change < -20 ? '#c00' : '#f60');
        }

        // Create popup content with AI explanation placeholder
        function createPopupContent(props, year, prevYear) {
            const currPop = props[`A00AA${year}`] || 0;
            const prevPop = props[`A00AA${prevYear}`] || 0;
            const change = calculateChange(currPop, prevPop);
            const changeWord = change > 0 ? "increase" : "decrease";
            
            return `<b>${props.NHGISNAM}</b><br>
                <b>State:</b> ${props.STATENAM}<br>
                <b>Year:</b> ${year}<br>
                <b>Population:</b> ${currPop.toLocaleString()}<br>
                <b>Change from ${prevYear}:</b> ${change !== null ? change.toFixed(2)+'% '+changeWord : 'No data'}<br>
                <div id="explanation-${props.NHGISNAM.replace(/\s+/g, '')}" class="explanation loading">
                    ${apiStatus === 'connected' ? 'Loading AI analysis...' : 'API connection issue'}
                </div>`;
        }

        // Load AI explanation
        async function getDeepSeekExplanation(countyName, year, prevYear, changeRate, stateName, elementId) {
            if (apiStatus !== 'connected') {
                document.getElementById(elementId).innerHTML = "API connection issue";
                document.getElementById(elementId).classList.remove('loading');
                return;
            }

            if (Math.abs(changeRate) < 4) {
                document.getElementById(elementId).innerHTML = "Change too small for analysis";
                document.getElementById(elementId).classList.remove('loading');
                return;
            }

            const prompt = `Explain why ${countyName}, ${stateName} had a ${changeRate.toFixed(2)}% population ${changeRate > 0 ? "increase" : "decrease"} between ${prevYear} and ${year}. Keep response brief (2 sentences).`;

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        "model": "deepseek/deepseek-chat:free",
                        "messages": [{ "role": "user", "content": prompt }],
                        "max_tokens": 150
                    })
                });

                const data = await response.json();
                const explanation = data?.choices?.[0]?.message?.content || "No explanation available.";
                document.getElementById(elementId).innerHTML = `<b>AI Analysis:</b><br>${explanation}`;
                document.getElementById(elementId).classList.remove('loading');
            } catch (err) {
                document.getElementById(elementId).innerHTML = "Error loading explanation";
                document.getElementById(elementId).classList.remove('loading');
            }
        }

        // Add data to map
        function addDataToMap(year, prevYear) {
            geojsonData.features.forEach(feature => {
                const props = feature.properties;
                const currPop = props[`A00AA${year}`] || 0;
                const prevPop = props[`A00AA${prevYear}`] || 0;
                const change = calculateChange(currPop, prevPop);

                const layer = L.geoJSON(feature, {
                    style: {
                        fillColor: getChangeColor(change),
                        weight: 1,
                        opacity: 1,
                        color: 'white',
                        fillOpacity: 0.7
                    }
                }).addTo(map);

                layer.bindPopup(createPopupContent(props, year, prevYear));
                
                layer.on('popupopen', function() {
                    if (change !== null && Math.abs(change) >= 4) {
                        getDeepSeekExplanation(
                            props.NHGISNAM,
                            year,
                            prevYear,
                            change,
                            props.STATENAM,
                            `explanation-${props.NHGISNAM.replace(/\s+/g, '')}`
                        );
                    }
                });
            });
        }

        // Add legend
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function() {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>Population Change</h4>
                <div><span style="background:#c00"></span> >20% decrease</div>
                <div><span style="background:#f60"></span> 0-20% decrease</div>
                <div><span style="background:#8d0"></span> 0-20% increase</div>
                <div><span style="background:#0c0"></span> >20% increase</div>
                <div><span style="background:#888"></span> No data</div>
            `;
            return div;
        };
        legend.addTo(map);

        // Initialize with 1830 data compared to 1820
        addDataToMap('1830', '1820');

        // Simple year selector
        const yearSelector = L.control({position: 'topright'});
        yearSelector.onAdd = function() {
            const div = L.DomUtil.create('div', 'year-selector');
            div.innerHTML = `
                <button onclick="addDataToMap('1830','1820')">1830 vs 1820</button>
                <button onclick="addDataToMap('1840','1830')">1840 vs 1830</button>
            `;
            return div;
        };
        yearSelector.addTo(map);
    </script>
</body>
</html>
