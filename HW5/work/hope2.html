<!DOCTYPE html>
<html>
<head>
    <title>US Population Change 1820-1920</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .info-button {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            padding: 8px 12px;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .api-status {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 8px 12px;
            background: white;
            border-radius: 4px;
        }
        .explanation {
            margin-top: 8px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
        }
        .loading { color: #666; font-style: italic; }
        .year-control {
            position: absolute;
            top: 50px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button class="info-button" onclick="showInfo()">ℹ️ About</button>
    <div class="api-status" id="apiStatus">API: Checking...</div>
    <div class="year-control" id="yearControls"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([39.8283, -98.5795], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // API Configuration
        const API_KEY = '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';
        const API_ENDPOINT = 'https://openrouter.ai/api/v1/chat/completions';
        let apiStatus = 'unknown';
        let currentLayers = [];

        // Test API connection
        checkAPIStatus();

        async function checkAPIStatus() {
            const statusElement = document.getElementById('apiStatus');
            try {
                const response = await fetch('https://openrouter.ai/api/v1/auth/key', {
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`
                    }
                });
                
                if (response.ok) {
                    apiStatus = 'connected';
                    statusElement.textContent = 'API: Connected';
                    statusElement.style.color = 'green';
                } else {
                    apiStatus = 'error';
                    statusElement.textContent = 'API: Error (check key)';
                    statusElement.style.color = 'red';
                }
            } catch (error) {
                apiStatus = 'error';
                statusElement.textContent = 'API: Connection failed';
                statusElement.style.color = 'red';
            }
        }

        function showInfo() {
            alert('US Population Change 1820-1920\n\nClick counties for AI explanations of population changes between decades');
        }

        // COMPLETE POPULATION DATA (1820-1920)
        const populationData = {
            "type": "FeatureCollection",
            "features": [
                // Kentucky - Oldham County
                {
                    "type": "Feature",
                    "properties": {
                        "NHGISNAM": "Oldham",
                        "STATENAM": "Kentucky",
                        "A00AA1820": 0,
                        "A00AA1830": 9588,
                        "A00AA1840": 7380,
                        "A00AA1850": 7629,
                        "A00AA1860": 7283,
                        "A00AA1870": 9027,
                        "A00AA1880": 7667,
                        "A00AA1890": 6754,
                        "A00AA1900": 7078,
                        "A00AA1910": 7248,
                        "A00AA1920": 7689
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[[-85.26,38.57],[-85.25,38.57],[-85.25,38.58],[-85.26,38.58],[-85.26,38.57]]]
                    }
                },
                // Kentucky - Jefferson County
                {
                    "type": "Feature",
                    "properties": {
                        "NHGISNAM": "Jefferson",
                        "STATENAM": "Kentucky",
                        "A00AA1820": 20310,
                        "A00AA1830": 26740,
                        "A00AA1840": 36230,
                        "A00AA1850": 59420,
                        "A00AA1860": 89220,
                        "A00AA1870": 118950,
                        "A00AA1880": 146010,
                        "A00AA1890": 188600,
                        "A00AA1900": 232700,
                        "A00AA1910": 262920,
                        "A00AA1920": 286369
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[[-85.30,38.10],[-85.29,38.10],[-85.29,38.20],[-85.30,38.20],[-85.30,38.10]]]
                    }
                },
                // Ohio - Hamilton County
                {
                    "type": "Feature",
                    "properties": {
                        "NHGISNAM": "Hamilton",
                        "STATENAM": "Ohio",
                        "A00AA1820": 31258,
                        "A00AA1830": 52277,
                        "A00AA1840": 80629,
                        "A00AA1850": 156844,
                        "A00AA1860": 216410,
                        "A00AA1870": 260370,
                        "A00AA1880": 313374,
                        "A00AA1890": 374573,
                        "A00AA1900": 409479,
                        "A00AA1910": 460732,
                        "A00AA1920": 493678
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[[-84.60,39.10],[-84.50,39.10],[-84.50,39.20],[-84.60,39.20],[-84.60,39.10]]]
                    }
                },
                // Illinois - Cook County
                {
                    "type": "Feature",
                    "properties": {
                        "NHGISNAM": "Cook",
                        "STATENAM": "Illinois",
                        "A00AA1820": 0,
                        "A00AA1830": 1072,
                        "A00AA1840": 10170,
                        "A00AA1850": 43735,
                        "A00AA1860": 144954,
                        "A00AA1870": 349966,
                        "A00AA1880": 607524,
                        "A00AA1890": 1176439,
                        "A00AA1900": 1833825,
                        "A00AA1910": 2600212,
                        "A00AA1920": 3356582
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[[-87.90,41.60],[-87.80,41.60],[-87.80,42.10],[-87.90,42.10],[-87.90,41.60]]]
                    }
                },
                // New York - New York County
                {
                    "type": "Feature",
                    "properties": {
                        "NHGISNAM": "New York",
                        "STATENAM": "New York",
                        "A00AA1820": 123706,
                        "A00AA1830": 202589,
                        "A00AA1840": 312710,
                        "A00AA1850": 515547,
                        "A00AA1860": 813669,
                        "A00AA1870": 942292,
                        "A00AA1880": 1164673,
                        "A00AA1890": 1515301,
                        "A00AA1900": 1857313,
                        "A00AA1910": 2331542,
                        "A00AA1920": 2284103
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[[-74.05,40.70],[-73.95,40.70],[-73.95,40.80],[-74.05,40.80],[-74.05,40.70]]]
                    }
                }
            ]
        };

        // Function to calculate population change
        function calculateChange(currPop, prevPop) {
            if (prevPop > 0) {
                return ((currPop - prevPop) / prevPop) * 100;
            }
            return null;
        }

        // Color scale for population change
        function getChangeColor(change) {
            if (change === null) return '#888';
            return change > 0 ? 
                   (change > 20 ? '#0c0' : '#8d0') :
                   (change < -20 ? '#c00' : '#f60');
        }

        // Create popup content
        function createPopupContent(props, year, prevYear) {
            const currPop = props[`A00AA${year}`] || 0;
            const prevPop = props[`A00AA${prevYear}`] || 0;
            const change = calculateChange(currPop, prevPop);
            const changeWord = change > 0 ? "increase" : "decrease";
            
            return `<b>${props.NHGISNAM} County</b><br>
                <b>State:</b> ${props.STATENAM}<br>
                <b>Year:</b> ${year}<br>
                <b>Population:</b> ${currPop.toLocaleString()}<br>
                <b>Change from ${prevYear}:</b> ${change !== null ? change.toFixed(2)+'% '+changeWord : 'No data'}<br>
                <div id="explanation-${props.NHGISNAM.replace(/\s+/g, '')}" class="explanation loading">
                    ${apiStatus === 'connected' ? 'Loading AI analysis...' : 'API connection issue'}
                </div>`;
        }

        // Load AI explanation
        async function getDeepSeekExplanation(countyName, year, prevYear, changeRate, stateName, elementId) {
            if (apiStatus !== 'connected') {
                document.getElementById(elementId).innerHTML = "API connection issue";
                document.getElementById(elementId).classList.remove('loading');
                return;
            }

            if (Math.abs(changeRate) < 4) {
                document.getElementById(elementId).innerHTML = "Change too small for analysis";
                document.getElementById(elementId).classList.remove('loading');
                return;
            }

            const prompt = `Explain why ${countyName} County, ${stateName} had a ${changeRate.toFixed(2)}% population ${changeRate > 0 ? "increase" : "decrease"} between ${prevYear} and ${year}. Keep response brief (2 sentences max). Focus on historical migration, economic, or social factors.`;

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        "model": "deepseek/deepseek-chat:free",
                        "messages": [{ "role": "user", "content": prompt }],
                        "max_tokens": 150
                    })
                });

                const data = await response.json();
                const explanation = data?.choices?.[0]?.message?.content || "No explanation available.";
                document.getElementById(elementId).innerHTML = `<b>AI Analysis:</b><br>${explanation}`;
                document.getElementById(elementId).classList.remove('loading');
            } catch (err) {
                document.getElementById(elementId).innerHTML = "Error loading explanation";
                document.getElementById(elementId).classList.remove('loading');
            }
        }

        // Add data to map
        function showDataForYear(year) {
            // Clear previous layers
            currentLayers.forEach(layer => map.removeLayer(layer));
            currentLayers = [];
            
            // Determine previous year (handling decade gaps)
            let prevYear = parseInt(year) - 10;
            if (year === '1890') prevYear = 1880;
            if (year === '1870') prevYear = 1860;
            if (year === '1830') prevYear = 1820;

            // Add new data
            populationData.features.forEach(feature => {
                const props = feature.properties;
                const currPop = props[`A00AA${year}`] || 0;
                const prevPop = props[`A00AA${prevYear}`] || 0;
                const change = calculateChange(currPop, prevPop);

                const layer = L.geoJSON(feature, {
                    style: {
                        fillColor: getChangeColor(change),
                        weight: 1,
                        opacity: 1,
                        color: 'white',
                        fillOpacity: 0.7
                    }
                }).addTo(map);

                layer.bindPopup(createPopupContent(props, year, prevYear));
                
                layer.on('popupopen', function() {
                    if (change !== null && Math.abs(change) >= 4) {
                        getDeepSeekExplanation(
                            props.NHGISNAM,
                            year,
                            prevYear,
                            change,
                            props.STATENAM,
                            `explanation-${props.NHGISNAM.replace(/\s+/g, '')}`
                        );
                    }
                });

                currentLayers.push(layer);
            });
        }

        // Add legend
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function() {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>Population Change</h4>
                <div><span style="background:#c00"></span> >20% decrease</div>
                <div><span style="background:#f60"></span> 0-20% decrease</div>
                <div><span style="background:#8d0"></span> 0-20% increase</div>
                <div><span style="background:#0c0"></span> >20% increase</div>
                <div><span style="background:#888"></span> No data</div>
            `;
            return div;
        };
        legend.addTo(map);

        // Add year controls
        const yearControls = document.getElementById('yearControls');
        const years = ['1820', '1830', '1840', '1850', '1860', '1870', '1890', '1900', '1910', '1920'];
        years.forEach(year => {
            const btn = document.createElement('button');
            btn.textContent = year;
            btn.onclick = () => showDataForYear(year);
            yearControls.appendChild(btn);
        });

        // Initialize with 1830 data
        showDataForYear('1830');
    </script>
</body>
</html>
