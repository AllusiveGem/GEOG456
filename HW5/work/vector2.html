<!DOCTYPE html>
<html>
<head>
    <title>GeoJSON Vector Tile Layer Toggler</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        #layer-control {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(20, 20, 30, 0.85);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            max-height: 80vh;
            overflow-y: auto;
            color: #fff;
            border: 1px solid #00f0ff;
        }
        .layer-item {
            margin: 5px 0;
        }
        .layer-section {
            margin-bottom: 15px;
            border-bottom: 1px solid #00f0ff;
            padding-bottom: 10px;
        }
        h3, h4 {
            margin: 5px 0;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 20, 0.9);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00f0ff;
        }
        #loading-bar {
            width: 300px;
            height: 20px;
            border: 1px solid #00f0ff;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        #loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #0066ff);
            transition: width 0.3s;
        }
        #loading-text {
            margin-top: 10px;
            font-size: 18px;
            text-shadow: 0 0 5px #00f0ff;
        }
        .color-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 5px;
            border: 1px solid #00f0ff;
            vertical-align: middle;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }
        #console-output {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(10, 10, 20, 0.8);
            color: #00f0ff;
            padding: 10px;
            border-radius: 5px;
            max-width: 500px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        button {
            background: #002130;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 5px 10px;
            margin: 2px;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
        }
        button:hover {
            background: #003545;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
        input[type="checkbox"], input[type="radio"] {
            accent-color: #00f0ff;
        }
        label {
            margin-left: 5px;
            vertical-align: middle;
        }
    </style>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading-container">
        <h2>Loading Map Data</h2>
        <div id="loading-bar">
            <div id="loading-progress"></div>
        </div>
        <div id="loading-text">Initializing...</div>
    </div>
    
    <div id="map"></div>
    <div id="layer-control">
        <h3>Layers</h3>
        
        <div class="layer-section">
            <h4>Basemap</h4>
            <div id="basemap-list"></div>
        </div>
        
        <div class="layer-section">
            <h4>GeoJSON Layers</h4>
            <div id="layer-list"></div>
        </div>
        
        <div class="layer-section">
            <h4>Debug Tools</h4>
            <button id="analyze-layers">Analyze Layers</button>
            <button id="toggle-console">Toggle Console Output</button>
            <button id="clear-console">Clear Console</button>
        </div>
    </div>
    
    <div id="console-output" style="display: none;"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <!-- Leaflet.VectorGrid plugin -->
    <script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>
    
    <!-- Your GeoJSON files -->
    <script src="1820.js"></script>
    <script src="1830.js"></script>
    <script src="1840.js"></script>
    <script src="1850.js"></script>
    <script src="1860.js"></script>
    <script src="1870.js"></script>
    <script src="1890.js"></script>
    <script src="1900.js"></script>
    <script src="1910.js"></script>
    <script src="1920.js"></script>
    <script src="trail.js"></script>
    <script src="river.js"></script>
    <script src="train2.js"></script>
    <script src="state.js"></script>
    
    <script>
        // Initialize the map
        const map = L.map('map').setView([39.8283, -98.5795], 4);
        
        // Console output manager
        const consoleOutput = {
            element: document.getElementById('console-output'),
            visible: false,
            
            log: function(message) {
                const entry = document.createElement('div');
                entry.textContent = `> ${message}`;
                this.element.appendChild(entry);
                this.element.scrollTop = this.element.scrollHeight;
                console.log(message);
            },
            
            clear: function() {
                this.element.innerHTML = '';
            },
            
            toggle: function() {
                this.visible = !this.visible;
                this.element.style.display = this.visible ? 'block' : 'none';
            }
        };
        
        // Global performance metrics
        const perfMetrics = {
            renderTimes: [],
            startTime: null,
            
            startTimer: function() {
                this.startTime = performance.now();
            },
            
            endTimer: function(label) {
                if (!this.startTime) return;
                const duration = performance.now() - this.startTime;
                this.renderTimes.push(duration);
                consoleOutput.log(`${label}: ${duration.toFixed(2)}ms`);
                this.startTime = null;
            },
            
            getAverageRenderTime: function() {
                if (this.renderTimes.length === 0) return 0;
                const sum = this.renderTimes.reduce((a, b) => a + b, 0);
                return sum / this.renderTimes.length;
            },
            
            reset: function() {
                this.renderTimes = [];
                this.startTime = null;
            }
        };
        
        // Base tile layers
        const baseLayers = {
            'OpenStreetMap': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }),
            'Carto Light': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/attribution">CARTO</a>'
            }),
            'Carto Dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors © CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            })
        };
        
        // Add Carto Dark as default base layer
        baseLayers['Carto Dark'].addTo(map);
        
        // Create base layer control UI
        const baseMapList = document.getElementById('basemap-list');
        
        Object.keys(baseLayers).forEach(name => {
            const div = document.createElement('div');
            div.className = 'layer-item';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'basemap';
            radio.id = 'base-' + name;
            radio.checked = name === 'Carto Dark';
            radio.addEventListener('change', function() {
                if (this.checked) {
                    Object.keys(baseLayers).forEach(n => {
                        if (n === name) {
                            map.addLayer(baseLayers[n]);
                            consoleOutput.log(`Switched basemap to "${name}"`);
                        } else {
                            map.removeLayer(baseLayers[n]);
                        }
                    });
                }
            });
            
            const label = document.createElement('label');
            label.htmlFor = 'base-' + name;
            label.textContent = name;
            
            div.appendChild(radio);
            div.appendChild(label);
            baseMapList.appendChild(div);
        });
        
        // Default fixed vectorization settings
        const vectorSettings = {
            tileSize: 256,
            maxZoom: 14,
            bufferSize: 128
        };
        
        // Object to store our layers
        const layers = {};
        
        // List of all your GeoJSON variable names
        const layerNames = [
            'state', 'train2', 'river', 'trail',
            'y1820', 'y1830', 'y1840', 'y1850', 
            'y1860', 'y1870', 'y1890', 'y1900',
            'y1910', 'y1920'
        ];
        
        // JDM Electric style colors for layers
        const layerColors = {
            'state': '#00BBFF',
            'river': '#00F0FF', // Electric blue for rivers
            'trail': '#FF9900', // Bright orange
            'train2': '#FF00CC', // Neon pink
            'y1820': '#FF3300',  // Bright red
            'y1830': '#FF6600',  // Orange
            'y1840': '#FFCC00',  // Yellow
            'y1850': '#99FF00',  // Lime green
            'y1860': '#00FF66',  // Mint green
            'y1870': '#00FFCC',  // Turquoise
            'y1890': '#0099FF',  // Blue
            'y1900': '#6600FF',  // Purple
            'y1910': '#CC00FF',  // Magenta
            'y1920': '#FF00FF'   // Hot pink
        };
        
        // Loading progress tracking
        const loadingProgress = {
            total: layerNames.length,
            loaded: 0,
            updateProgress: function() {
                const percent = Math.round((this.loaded / this.total) * 100);
                document.getElementById('loading-progress').style.width = percent + '%';
                document.getElementById('loading-text').textContent = 
                    `Loading layers (${this.loaded}/${this.total})...`;
                
                if (this.loaded === this.total) {
                    setTimeout(() => {
                        document.getElementById('loading-container').style.display = 'none';
                        // Add default layers
                        if (layers.state) {
                            layers.state.addTo(map);
                            document.getElementById('state').checked = true;
                            consoleOutput.log("Added default layer: state");
                        }
                        if (layers.river) {
                            layers.river.addTo(map);
                            document.getElementById('river').checked = true;
                            consoleOutput.log("Added default layer: river");
                        }
                        
                        // Log initialization complete
                        consoleOutput.log("Map initialization complete");
                        consoleOutput.log(`Ready with ${layerNames.length} vector layers`);
                    }, 500);
                }
            }
        };
        
        // Function to generate random neon colors
        function getRandomColor() {
            const neonColors = [
                '#FF00FF', '#00FFFF', '#FF0000', '#00FF00', '#0000FF', 
                '#FFFF00', '#00FFCC', '#FF00CC', '#CCFF00', '#CC00FF'
            ];
            return neonColors[Math.floor(Math.random() * neonColors.length)];
        }
        
        // Function to create a vector tile layer
        function createVectorTileLayer(name, geoJsonData) {
            const layerColor = layerColors[name] || getRandomColor();
            
            perfMetrics.startTimer();
            
            const layer = L.vectorGrid.slicer(geoJsonData, {
                rendererFactory: L.svg.tile,
                vectorTileLayerStyles: {
                    sliced: {
                        color: layerColor,
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0.5,
                        fillColor: layerColor
                    }
                },
                maxZoom: vectorSettings.maxZoom,
                tileSize: vectorSettings.tileSize,
                buffer: vectorSettings.bufferSize,
                interactive: true,
                getFeatureId: function(f) {
                    return f.properties.id || L.stamp(f);
                }
            });
            
            perfMetrics.endTimer(`Created layer "${name}"`);
            
            // Store feature count in layer metadata
            if (geoJsonData && geoJsonData.features) {
                layer.featureCount = geoJsonData.features.length;
            } else {
                layer.featureCount = 0;
            }
            
            return layer;
        }
        
        // Function to create layer control UI element
        function createLayerControlUI(name, color) {
            const div = document.createElement('div');
            div.className = 'layer-item';
            
            const colorIndicator = document.createElement('span');
            colorIndicator.className = 'color-indicator';
            colorIndicator.style.backgroundColor = color;
            colorIndicator.style.boxShadow = `0 0 5px ${color}`;
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = name;
            checkbox.addEventListener('change', function() {
                perfMetrics.startTimer();
                if (this.checked) {
                    layers[name].addTo(map);
                    consoleOutput.log(`Added layer: ${name}`);
                } else {
                    map.removeLayer(layers[name]);
                    consoleOutput.log(`Removed layer: ${name}`);
                }
                perfMetrics.endTimer(`Toggle layer "${name}"`);
            });
            
            const label = document.createElement('label');
            label.htmlFor = name;
            label.textContent = name;
            
            div.appendChild(colorIndicator);
            div.appendChild(checkbox);
            div.appendChild(label);
            document.getElementById('layer-list').appendChild(div);
        }
        
        // Function to initialize all layers
        function initializeLayers() {
            // Clear existing layers
            layerNames.forEach(name => {
                if (layers[name]) {
                    map.removeLayer(layers[name]);
                    layers[name] = null;
                }
            });
            
            // Clear layer list UI
            document.getElementById('layer-list').innerHTML = '';
            
            // Reset progress
            loadingProgress.loaded = 0;
            loadingProgress.updateProgress();
            document.getElementById('loading-container').style.display = 'flex';
            
            // Reset performance metrics
            perfMetrics.reset();
            
            consoleOutput.log("Initializing layers...");
            
            // Create layers with current settings
            layerNames.forEach(name => {
                // Update loading text to show current layer being processed
                document.getElementById('loading-text').textContent = `Processing ${name}...`;
                
                // Process in small chunks to keep UI responsive
                setTimeout(() => {
                    // Check if the variable exists in global scope
                    if (window[name]) {
                        try {
                            const layerColor = layerColors[name] || getRandomColor();
                            
                            layers[name] = createVectorTileLayer(name, window[name]);
                            
                            // Add popup functionality
                            layers[name].on('click', function(e) {
                                const props = e.layer.properties;
                                let popupContent = `<div style="color:#000;"><b>${name}</b><br>`;
                                
                                for (const key in props) {
                                    popupContent += `${key}: ${props[key]}<br>`;
                                }
                                popupContent += '</div>';
                                
                                L.popup()
                                    .setContent(popupContent)
                                    .setLatLng(e.latlng)
                                    .openOn(map);
                                    
                                consoleOutput.log(`Clicked on ${name} at ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`);
                            });
                            
                            // Create layer control UI element
                            createLayerControlUI(name, layerColor);
                            
                        } catch (e) {
                            console.error(`Error processing layer ${name}:`, e);
                            consoleOutput.log(`ERROR: Failed to process layer "${name}": ${e.message}`);
                        }
                    } else {
                        console.warn(`Variable ${name} not found in global scope`);
                        consoleOutput.log(`WARNING: Variable "${name}" not found`);
                    }
                    
                    // Update progress
                    loadingProgress.loaded++;
                    loadingProgress.updateProgress();
                    
                }, 0); // Small timeout to allow UI updates between layers
            });
        }
        
        // Initialize layers on load
        initializeLayers();
        
        // Performance information display
        map.on('zoomend moveend', function() {
            const zoom = map.getZoom();
            const bounds = map.getBounds();
            const center = map.getCenter();
            
            console.log(`Map view updated - Zoom: ${zoom}, Center: ${center.lat.toFixed(4)}, ${center.lng.toFixed(4)}`);
            consoleOutput.log(`Map updated: Zoom ${zoom}, Center [${center.lat.toFixed(4)}, ${center.lng.toFixed(4)}]`);
        });
        
        // Debug buttons
        document.getElementById('toggle-console').addEventListener('click', function() {
            consoleOutput.toggle();
            this.textContent = consoleOutput.visible ? 'Hide Console' : 'Show Console';
        });
        
        document.getElementById('clear-console').addEventListener('click', function() {
            consoleOutput.clear();
            consoleOutput.log("Console cleared");
        });
        
        document.getElementById('analyze-layers').addEventListener('click', function() {
            consoleOutput.log("--- Layer Analysis ---");
            
            // Count active layers
            const activeLayers = Object.keys(layers).filter(name => map.hasLayer(layers[name]));
            consoleOutput.log(`Active layers: ${activeLayers.length}/${Object.keys(layers).length}`);
            
            // Report feature counts
            let totalFeatures = 0;
            Object.keys(layers).forEach(name => {
                if (layers[name] && layers[name].featureCount) {
                    const isActive = map.hasLayer(layers[name]) ? "(active)" : "(inactive)";
                    consoleOutput.log(`${name}: ${layers[name].featureCount} features ${isActive}`);
                    if (map.hasLayer(layers[name])) {
                        totalFeatures += layers[name].featureCount;
                    }
                }
            });
            
            consoleOutput.log(`Total active features: ${totalFeatures}`);
            consoleOutput.log(`Current zoom level: ${map.getZoom()}`);
            consoleOutput.log(`Average render time: ${perfMetrics.getAverageRenderTime().toFixed(2)}ms`);
            consoleOutput.log("----------------------");
        });
        
        // Expose utility functions to window for console access
        window.mapUtils = {
            getLayerInfo: function() {
                return Object.keys(layers).map(name => ({
                    name,
                    active: map.hasLayer(layers[name]),
                    featureCount: layers[name] ? (layers[name].featureCount || 0) : 0
                }));
            },
            
            toggleAllLayers: function(value) {
                Object.keys(layers).forEach(name => {
                    const checkbox = document.getElementById(name);
                    if (checkbox) {
                        checkbox.checked = value;
                        if (value) {
                            if (!map.hasLayer(layers[name])) {
                                layers[name].addTo(map);
                            }
                        } else {
                            if (map.hasLayer(layers[name])) {
                                map.removeLayer(layers[name]);
                            }
                        }
                    }
                });
                consoleOutput.log(`${value ? 'Enabled' : 'Disabled'} all layers`);
                return `${value ? 'Enabled' : 'Disabled'} all layers`;
            },
            
            showLayerByYear: function(year) {
                // First disable all year layers
                ['y1820', 'y1830', 'y1840', 'y1850', 'y1860', 'y1870', 'y1890', 'y1900', 'y1910', 'y1920'].forEach(name => {
                    const checkbox = document.getElementById(name);
                    if (checkbox) {
                        checkbox.checked = false;
                        if (map.hasLayer(layers[name])) {
                            map.removeLayer(layers[name]);
                        }
                    }
                });
                
                // Enable the requested year
                const layerName = `y${year}`;
                if (layers[layerName]) {
                    const checkbox = document.getElementById(layerName);
                    if (checkbox) {
                        checkbox.checked = true;
                    }
                    layers[layerName].addTo(map);
                    consoleOutput.log(`Showing year ${year} data`);
                    return `Showing year ${year} data`;
                } else {
                    consoleOutput.log(`Year ${year} data not available`);
                    return `Year ${year} data not available`;
                }
            },
            
            fitToLayer: function(name) {
                if (layers[name] && layers[name].getBounds) {
                    map.fitBounds(layers[name].getBounds());
                    consoleOutput.log(`Fit map to layer "${name}"`);
                    return `Fit map to layer "${name}"`;
                } else {
                    consoleOutput.log(`Cannot fit to layer "${name}" - no bounds available`);
                    return `Cannot fit to layer "${name}" - no bounds available`;
                }
            },
            
            performanceReport: function() {
                const report = {
                    averageRenderTime: perfMetrics.getAverageRenderTime(),
                    renderCount: perfMetrics.renderTimes.length,
                    minRenderTime: Math.min(...perfMetrics.renderTimes) || 0,
                    maxRenderTime: Math.max(...perfMetrics.renderTimes) || 0,
                    activeLayerCount: Object.keys(layers).filter(name => map.hasLayer(layers[name])).length,
                    zoom: map.getZoom(),
                    tileSize: vectorSettings.tileSize,
                    maxZoom: vectorSettings.maxZoom,
                    bufferSize: vectorSettings.bufferSize
                };
                
                consoleOutput.log(JSON.stringify(report, null, 2));
                return report;
            }
        };
        
        // Log that we're ready
        setTimeout(() => {
            consoleOutput.toggle();
            consoleOutput.log("Map initialized and ready");
            consoleOutput.log("Use mapUtils in console to access utility functions");
        }, 1000);
    </script>
</body>
</html>
