<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Plan</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"
    integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ=="
    crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"
    integrity="sha512-BB3hKbKWOc9Ez/TAwyWxNXeoV9c1v6FIeYiBieIWkpLjauysF18NzgR1MBNBXf8/KABdlkX68nAhlwcDFLGPCQ=="
    crossorigin=""></script>
    <script src="annexations.js"></script>
</head>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #B9975B;
        }
        h2 {
            color: #046A38;
        }
        #map {
            width: 90%;
            height: 700px;
            margin: auto;
            border: 2px solid #046A38;
            border-radius: 10px;
        }
        #yearSlider {
            width: 80%;
            margin: 10px;
        }
        #CurrentYear {
            font-size: 24px;
            color: #27251F;
        }
    </style>

<body>
<h2>Annexations of the City of Charlotte</h2>
        <h3 id = CurrentYear>Year</h3>
        <input id = "yearSlider" type="range" name="year" min="1855" max="2025" oninput="moveSlider(this.value)" value="1855">
    <div id="map"></div>


</body>
<script>
    var map = L.map('map').setView([35.2071, -80.8431], 11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    }).addTo(map);

    function myStyle(features) {
        return {
          "color": getColor(features.properties.YearAppr), 
         "weight": 0.5,
           "opacity": 0.50
        }
    };

    function getColor(d) {
        return d < myCurrentSelectionYear ? "#046A38" : 
                    "white" ;
    }

    var geojson = L.geoJSON(annexations, {style: myStyle}).addTo(map);


    var myCurrentSelectionYear = 1855 

    function moveSlider(value) { 
        document.getElementById('CurrentYear').innerHTML = 'Year: ' + value 
        myCurrentSelectionYear = value
        geojson.resetStyle() 
    }

    moveSlider(myCurrentSelectionYear)  



    window.onload = function() {
        document.getElementById('yearSlider').value = 1855;  
    }; 

</script>   
</body>
</html>
