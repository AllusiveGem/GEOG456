<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON Train Data YIPPIES</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"
    integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ=="
    crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"
    integrity="sha512-BB3hKbKWOc9Ez/TAwyWxNXeoV9c1v6FIeYiBieIWkpLjauysF18NzgR1MBNBXf8/KABdlkX68nAhlwcDFLGPCQ=="
    crossorigin=""></script>
    <script src="train.js"></script>
</head>
<style>
        h1 {
        font-family:Arial;
        font-size: 36px;
        position: relative;
        top: 10%;
        text-align: center;
        outline-style: ridge;
        -webkit-text-stroke-width: 1px;
        color: #ffffff;
        }

        body {
            font-family: Arial;
            text-align: center;
            background-color: #0D0D0D;
        }
        h2 {
            color: #00BFFF;
        }
        #map {
            width: 90%;
            height: 700px;
            margin: auto;
            border: 2px solid #27251F;
            border-radius: 10px;
        }
        #trainSlider {
            width: 80%;
            margin: 10px;
        }
        #CurrentYear {
            font-size: 24px;
            color: #00BFFF;
        }
</style>

<body>
<h1>Growth of the American Railroad Industry</h1>
<h2>Train Maps from 1830 to 1920</h2>
    <h3 id="CurrentYear">Year</h3>
    <input id="trainSlider" type="range" name="year" min="1830" max="1920" oninput="moveSlider(this.value)" value="1830">
<div id="map"></div>

</body>
<script>
var map = L.map('map').setView([39.8283, -98.5795], 4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a> & OpenStreetMap contributors'
}).addTo(map);

function getColor(d) {
    return d < myCurrentSelectionYear ? "#00BFFF" : "#0D0D0D";
}

function myStyle(features) {
    return {
        "color": getColor(features.properties.InOpBy),
        "weight": 0.5,
        "opacity": 0.75
    }
};

var geojson = L.geoJSON(train, {style: myStyle}).addTo(map);

var myCurrentSelectionYear = 1830;

function moveSlider(value) {
    document.getElementById('CurrentYear').innerHTML = 'Year: ' + value;
    myCurrentSelectionYear = value;
    geojson.resetStyle();
}

moveSlider(myCurrentSelectionYear);

window.onload = function() {
    document.getElementById('trainSlider').value = 1830;  
};

</script>   
</html>
